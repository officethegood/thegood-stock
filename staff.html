<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thegood Stock</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/styles.css">
</head>
<body>

<nav class="fc-topbar fc-reveal fc-reveal-1">
  <span class="fc-brand">
    <span class="fc-brand-mark" id="brand-mark"></span>
    <span class="fc-display" style="font-size:18px;letter-spacing:0.01em">thegood</span><span class="fc-mono" style="color:var(--fc-vital);font-weight:600">/stock</span>
    <span class="fc-topbar-role">staff view</span>
  </span>
  <div style="display:flex;align-items:center;gap:var(--fc-s3)">
    <span style="font-family:var(--fc-font-mono);font-size:12px;opacity:0.7"><span id="user-name">…</span></span>
    <a href="./admin.html" id="link-admin" class="fc-btn fc-btn-ghost d-none" style="padding:6px 12px;min-height:36px;color:var(--fc-paper);border-color:rgba(248,245,239,0.25);text-decoration:none;font-size:13px" title="กลับหน้า admin">
      <i class="bi bi-gear me-1"></i>Admin
    </a>
    <button class="fc-btn fc-btn-ghost" id="btn-logout" style="padding:6px 12px;min-height:36px;color:var(--fc-paper);border-color:rgba(248,245,239,0.25)">ออก</button>
  </div>
</nav>
<script>document.addEventListener('DOMContentLoaded',()=>{var m=document.getElementById('brand-mark');if(m&&window.Icons)m.innerHTML=window.Icons.cross('');m&&(m.style.cssText='display:inline-flex;width:28px;height:28px;border-radius:6px;background:var(--fc-vital);align-items:center;justify-content:center;color:#fff;padding:4px');
  // Show Admin link only if user is Admin
  if (typeof window.getUserRole === 'function' && window.getUserRole() === 'Admin') {
    var a = document.getElementById('link-admin'); if (a) a.classList.remove('d-none');
  }
});</script>

<header class="fc-page-hero fc-reveal fc-reveal-2">
  <p class="fc-page-hero-breadcrumb">STAFF / HOME</p>
  <h1 class="fc-page-hero-title">สวัสดี <span id="user-name-2"></span></h1>
  <p class="fc-page-hero-lede">เครื่องมือทำงานประจำวัน</p>
</header>

<div class="container mt-4 fc-staff-content">

  <!-- CARD 1 — Primary: Scan (full width, vital-teal) -->
  <a href="./staff-scan.html" class="fc-card fc-reveal fc-reveal-3 fc-home-card-primary text-decoration-none d-flex align-items-center gap-3" id="card-scan" style="margin-bottom:var(--fc-s4);min-height:96px;background:var(--fc-vital);color:#fff;cursor:pointer">
    <span id="card-scan-icon" style="display:inline-flex;flex-shrink:0;width:48px;height:48px;background:rgba(255,255,255,0.15);border-radius:12px;align-items:center;justify-content:center"></span>
    <span>
      <span style="display:block;font-size:20px;font-weight:700;font-family:var(--fc-font-display);line-height:1.2">สแกน เบิก-จ่าย</span>
      <span style="display:block;font-size:13px;opacity:0.8;margin-top:2px">สแกน QR ของ · สถานที่ · กระเป๋า</span>
    </span>
  </a>

  <!-- ROW: Card 2 + Card 3 -->
  <div class="fc-reveal fc-reveal-4" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--fc-s4);margin-bottom:var(--fc-s4)">

    <!-- CARD 2 — Linen (expandable) -->
    <div class="fc-card fc-home-card-secondary" id="card-linen" style="cursor:pointer">
      <div id="card-linen-header" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px;text-align:center;gap:var(--fc-s2)" role="button" aria-expanded="false" aria-controls="card-linen-actions" tabindex="0">
        <span id="card-linen-icon" style="display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;color:var(--fc-vital)"></span>
        <span style="font-size:15px;font-weight:600;font-family:var(--fc-font-display);line-height:1.2">ผ้า / ของซัก</span>
        <span style="font-size:11px;color:var(--fc-ink-mute)">เติม · ส่งซัก · รับคืน</span>
      </div>
      <div id="card-linen-actions" style="display:none;margin-top:var(--fc-s3);padding-top:var(--fc-s3);border-top:1px solid var(--fc-hairline)">
        <div style="display:flex;flex-direction:column;gap:var(--fc-s2)">
          <button class="fc-btn fc-btn-secondary" onclick="Laundry.openModal('fill_vehicle')" style="min-height:44px;font-size:13px;justify-content:center"><i class="bi bi-truck me-1"></i>เติมรถ</button>
          <button class="fc-btn fc-btn-secondary" onclick="Laundry.openModal('mark_dirty')" style="min-height:44px;font-size:13px;justify-content:center"><i class="bi bi-droplet-half me-1"></i>ใช้/เปื้อน</button>
          <button class="fc-btn fc-btn-secondary" onclick="Laundry.openModal('send_wash')" style="min-height:44px;font-size:13px;justify-content:center"><i class="bi bi-send me-1"></i>ส่งซัก</button>
          <button class="fc-btn fc-btn-secondary" onclick="Laundry.openModal('receive_back')" style="min-height:44px;font-size:13px;justify-content:center"><i class="bi bi-box-arrow-in-down me-1"></i>รับคืน</button>
        </div>
      </div>
    </div>

    <!-- CARD 3 — Oxygen -->
    <a href="./staff-oxygen.html" class="fc-card fc-home-card-secondary text-decoration-none d-flex flex-column align-items-center justify-content-center text-center" style="min-height:80px;gap:var(--fc-s2)">
      <span id="card-oxy-icon" style="display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;color:var(--fc-vital)"></span>
      <span style="font-size:15px;font-weight:600;font-family:var(--fc-font-display);line-height:1.2;color:var(--fc-ink)">ออกซิเจน</span>
      <span style="font-size:11px;color:var(--fc-ink-mute)">สแกน · ดูถัง O₂</span>
    </a>

  </div>

  <!-- Secondary text-link row -->
  <div class="fc-reveal fc-reveal-4" style="display:flex;flex-wrap:wrap;gap:var(--fc-s2) var(--fc-s4);margin-bottom:var(--fc-s5);align-items:center">
    <span class="fc-mono" style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fc-ink-mute)">เครื่องมือ:</span>
    <button class="fc-text-link" id="btn-view-loc">ดูสถานที่</button>
    <button class="fc-text-link" id="btn-view-amb">ดูรถพยาบาล</button>
    <button class="fc-text-link" id="btn-view-bags">ดูกระเป๋า ALS</button>
    <a href="./staff-print.html" class="fc-text-link">พิมพ์ QR</a>
  </div>

  <div class="fc-reveal fc-reveal-5" id="staff-detail">
    <div class="fc-empty">
      <svg class="fc-empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
      <span class="fc-empty-label">// no data</span>
    </div>
  </div>
</div>

<nav class="fc-bottom-nav" aria-label="staff navigation">
  <a href="./staff.html" class="active" id="bn-home" aria-label="หน้าหลัก"><span id="bn-icon-home"></span><span>หลัก</span></a>
  <a href="./staff-scan.html" id="bn-scan" aria-label="สแกน"><span id="bn-icon-scan"></span><span>สแกน</span></a>
  <a href="./staff-oxygen.html" id="bn-oxy" aria-label="ออกซิเจน"><span id="bn-icon-oxy"></span><span>O₂</span></a>
  <a href="./staff-print.html" id="bn-print" aria-label="พิมพ์ QR"><span id="bn-icon-print"></span><span>พิมพ์</span></a>
</nav>
<script>document.addEventListener('DOMContentLoaded',()=>{if(!window.Icons)return;
  document.getElementById('bn-icon-home').innerHTML=window.Icons.cross('');
  document.getElementById('bn-icon-scan').innerHTML=window.Icons.scan('');
  document.getElementById('bn-icon-oxy').innerHTML=window.Icons.cylinder('');
  document.getElementById('bn-icon-print').innerHTML=window.Icons.printer('');
  document.body.style.paddingBottom='80px';
});</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared/config.js"></script>
<script src="./shared/supabase-client.js"></script>
<script src="./shared/auth.js"></script>
<script src="./shared/auth-jwt.js"></script>
<script src="./shared/ui.js"></script>
<script src="./shared/icons.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Card icons (icons.js must be loaded first)
  if (window.Icons) {
    var si = document.getElementById('card-scan-icon');
    var li = document.getElementById('card-linen-icon');
    var oi = document.getElementById('card-oxy-icon');
    if (si) si.innerHTML = window.Icons.scan('width:28px;height:28px;color:#fff');
    if (li) li.innerHTML = window.Icons.linen ? window.Icons.linen('') : '<i class="bi bi-bag-heart" style="font-size:22px"></i>';
    if (oi) oi.innerHTML = window.Icons.cylinder ? window.Icons.cylinder('') : '<i class="bi bi-circle-square" style="font-size:22px"></i>';
  }
  // Linen card expand/collapse
  var header = document.getElementById('card-linen-header');
  var actions = document.getElementById('card-linen-actions');
  if (header && actions) {
    function toggleLinen() {
      var open = actions.style.display !== 'none';
      actions.style.display = open ? 'none' : 'block';
      header.setAttribute('aria-expanded', String(!open));
    }
    header.addEventListener('click', toggleLinen);
    header.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLinen(); } });
  }
});
</script>
<script src="./shared/settings.js"></script>
<script src="./shared/laundry.js"></script>
<script src="./shared/locations-graph.js"></script>
<script src="./js/staff-home.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW failed', e)));
  // Auto-heal after a deploy: when the updated service worker takes control,
  // reload once so the page runs the freshly precached files instead of the
  // stale (possibly broken) copies it booted from. hadCtrl skips the very
  // first install; __swAutoReloaded guards against reload loops.
  let hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadCtrl && !window.__swAutoReloaded) { window.__swAutoReloaded = true; location.reload(); }
    hadCtrl = true;
  });
}
</script>

</body>
</html>
