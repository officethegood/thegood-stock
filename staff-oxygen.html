<style>
  /* Page-local styles — mirrors staff-scan.html pattern for consistency.
     Gloved-hand targets: tap cards >= 60px (UX §1.3). */
  body { background-color: #f5f7fa; }
  .oxy-wrap { max-width: 480px; margin: 0 auto; padding: 0 12px 32px; }

  /* 7-step wizard steps */
  .oxy-step { display: none; }
  .oxy-step.active { display: block; }

  /* Transition tap cards (UX §3.5 gloved-hands, min 60px) */
  .oxy-choice-card {
    min-height: 60px;
    border: 2px solid #dee2e6;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    transition: border-color .15s, background .15s;
    margin-bottom: 10px;
  }
  .oxy-choice-card:hover,
  .oxy-choice-card.selected {
    border-color: var(--stock-accent, #0d9488);
    background: #f0fdfa;
  }
  .oxy-choice-card .choice-label { font-weight: 500; font-size: 1.05rem; }

  /* Status badge in tank card */
  .oxy-tank-card {
    border-radius: 14px;
    border: 1px solid #dee2e6;
    background: #fff;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  /* Step indicator dots */
  .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #dee2e6; }
  .step-dot.done { background: var(--stock-accent, #0d9488); }
  .step-dot.active { background: var(--stock-accent-dark, #0f766e); width: 20px; border-radius: 4px; }

  /* Success overlay */
  .oxy-success-overlay {
    border-radius: 14px;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    text-align: center;
    padding: 32px 20px;
  }
  .oxy-success-overlay .ok-icon { font-size: 4rem; line-height: 1; }
  .oxy-success-overlay .ok-main { font-size: 1.4rem; font-weight: 700; margin-top: 10px; }
  .oxy-success-overlay .ok-detail { font-size: 1rem; margin-top: 6px; opacity: .9; }

  /* Photo preview */
  .oxy-photo-preview { max-width: 80px; height: 60px; object-fit: cover; border-radius: 6px; }

  /* Camera <video> sizing — MUST be a descendant CSS rule, not inline style on the
     element. On iOS the scanner falls back to html5-qrcode, which REPLACES our
     original <video> with a wrapper div and injects its OWN <video> inside it.
     An inline style lives on the original element and is lost on replace, so the
     injected video renders unsized and iOS never decodes (camera shows, no read).
     A descendant rule (like staff-scan's `.scan-stage video`) also matches the
     injected <video>, so the fallback decodes correctly. Android uses the native
     path (no injection) and was unaffected either way. */
  #oxy-scan-stage video { width: 100%; height: 100%; object-fit: cover; display: block; }

  @media (max-width: 575.98px) {
    .oxy-wrap { padding: 0 8px 32px; }
  }
</style>
</head>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW failed', e))
    );
    // Auto-heal after a deploy: when the updated service worker takes control,
    // reload once so the page runs the freshly precached files instead of the
    // stale (possibly broken) copies it booted from. hadCtrl skips the very
    // first install; __swAutoReloaded guards against reload loops.
    let hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadCtrl && !window.__swAutoReloaded) { window.__swAutoReloaded = true; location.reload(); }
      hadCtrl = true;
    });
  }
</script>
